
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Shristi</title>

    <link rel="stylesheet" href="{% static 'accounts/css/authentication.css' %}">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-form-section">

            <div class="auth-form-container">

                <div class="auth-logo">
                    <h2>Shristi</h2>
                    <span>ACCOUNT RECOVERY</span>
                </div>

                <div class="auth-heading">
                    <h1>Forgot Your Password?</h1>
                    <p>
                        Don't worry! Enter your registered email address.
                        We'll send you a verification code to reset your password.
                    </p>
                </div>

                <form method="POST">

                    {% csrf_token %}

                    <div class="auth-input-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your registered email"
                            required
                        >
                    </div>

                    <button type="submit" class="auth-primary-button">
                        Send Verification Code
                    </button>

                </form>

                <div class="auth-switch-link">
                    <p>
                        Remember your password?
                        <a href="{% url 'accounts:customer_login' %}">
                            Back to Login
                        </a>
                    </p>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
