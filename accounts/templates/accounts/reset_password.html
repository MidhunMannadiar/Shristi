
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Shristi</title>

    <link rel="stylesheet" href="{% static 'accounts/css/authentication.css' %}">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-form-section">

            <div class="auth-form-container">

                <div class="auth-logo">
                    <h2>Shristi</h2>
                    <span>ACCOUNT SECURITY</span>
                </div>

                <div class="auth-heading">
                    <h1>Set New Password</h1>
                    <p>
                        Create a strong password to keep your Shristi account secure.
                    </p>
                </div>

                <form method="POST">

                    {% csrf_token %}

                    <div class="auth-input-group">
                        <label for="newPassword">New Password</label>
                        <input
                            type="password"
                            id="newPassword"
                            name="new_password"
                            placeholder="Enter your new password"
                            required
                        >
                    </div>

                    <div class="auth-input-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            placeholder="Confirm your new password"
                            required
                        >
                    </div>

                    <button type="submit" class="auth-primary-button">
                        Reset Password
                    </button>

                </form>

                <div class="auth-switch-link">
                    <a href="{% url 'accounts:customer_login' %}">
                        Back to Login
                    </a>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
