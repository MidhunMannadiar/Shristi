
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | Shristi</title>

    <link rel="stylesheet"
          href="{% static 'accounts/css/authentication.css' %}">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-form-section">

            <div class="auth-form-container">

                <div class="auth-logo">
                    <h2>Shristi</h2>
                    <span>ACCOUNT SECURITY</span>
                </div>

                <div class="auth-heading">

                    <h1>Change Password</h1>

                    <p>
                        Update your password to keep your Shristi
                        account secure.
                    </p>

                </div>

                {% if messages %}
                    <div class="auth-messages">
                        {% for message in messages %}
                            <div class="auth-message {{ message.tags }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="auth-input-group">

                        <label for="currentPassword">
                            Current Password
                        </label>

                        <input
                            type="password"
                            id="currentPassword"
                            name="current_password"
                            placeholder="Enter your current password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <div class="auth-input-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            name="new_password"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                    <div class="auth-input-group">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            placeholder="Confirm your new password"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                    <button type="submit" class="auth-primary-button">
                        Update Password
                    </button>

                </form>

                <div class="auth-back-link">
                    <a href="{% url 'accounts:customer_profile' %}">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back to My Profile
                    </a>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
