
{% extends "storefront/base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/email_change.css' %}">
{% endblock %}

{% block content %}

<div class="email-change-container">

    <div class="email-change-card">

        <div class="email-change-icon">
            <i class="fa-regular fa-envelope"></i>
        </div>

        <span class="email-change-subtitle">ACCOUNT SETTINGS</span>

        <h2>Change Your Email</h2>

        <p class="email-change-description">
            Keep your account connected. Enter your new email address
            and we'll send you a verification code.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="email">New Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your new email address"
                    required
                    autocomplete="email"
                >
            </div>

            <button type="submit" class="email-change-btn">
                Send Verification Code
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <a href="{% url 'accounts:customer_profile' %}" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Profile
        </a>

    </div>

</div>

{% endblock %}
