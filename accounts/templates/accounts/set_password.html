{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Password | Shristi</title>

    <link rel="stylesheet" href="{% static 'accounts/css/authentication.css' %}">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="auth-page">

        <section class="auth-form-section">

            <div class="auth-form-container">

                <div class="auth-logo">
                    <h2>Shristi</h2>
                    <span>ACCOUNT SECURITY</span>
                </div>

                <div class="auth-heading">
                    <h1>Create Your Password</h1>
                    <p>
                        Your email has been verified.
                        Create a secure password to complete your registration.
                    </p>
                </div>

                <form method="POST">

                    {% csrf_token %}

                    <div class="auth-input-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="auth-input-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button type="submit" class="auth-primary-button">
                        Create Account
                    </button>

                </form>

            </div>

        </section>

    </main>

</body>
</html>
